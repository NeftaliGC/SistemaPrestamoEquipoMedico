; Proyecto PlatformIO — Lector RFID RC522 para ESP32 Super Mini
; (sistema de préstamo de equipo médico)
;
; Tres entornos según la variante de la placa:
;   esp32-supermini   → ESP32 Super Mini clásico (WROOM-32E)
;   esp32c3-supermini → ESP32-C3 SuperMini (USB nativo en GPIO18/19)
;   esp32s3-supermini → ESP32-S3 SuperMini (USB nativo en GPIO19/20)
;
; Compilar y subir (elegir el entorno de su placa):
;   pio run -e esp32s3-supermini -t upload   ← placa detectada: ESP32-S3
;   pio run -e esp32-supermini   -t upload
;   pio run -e esp32c3-supermini -t upload
; Monitor serial:   pio device monitor   (115200 baud)

[platformio]
default_envs = esp32s3-supermini

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
build_flags =
    -Wall

; ESP32-S3 SuperMini (dual-core Xtensa, USB nativo en GPIO19/20)
; Sin puente serial: el firmware envía Serial por el USB nativo (CDC on boot)
; Flash real de la Super Mini S3: 4 MB (el devkitc-1 asume 8 MB por defecto)
[env:esp32s3-supermini]
platform = espressif32
board = adafruit_qtpy_esp32s3_n4r2
board_upload.flash_size = 4MB
board_build.flash_mode = dio
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
