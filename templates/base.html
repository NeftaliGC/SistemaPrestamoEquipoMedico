<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Préstamo de Equipo Médico{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="barra-superior">
    <div class="logo">🏥 Sistema de Préstamo de Equipo Médico</div>
    <nav class="nav">
      <a href="{{ url_for('index') }}">Dashboard</a>
      <a href="{{ url_for('prestamos') }}">Préstamos</a>
      <a href="{{ url_for('equipos_pagina') }}">Equipos</a>
      <a href="{{ url_for('personas_pagina') }}">Personal</a>
    </nav>
  </header>

  <main class="contenido">
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, mensaje in mensajes %}
        <div class="flash flash-{{ categoria }}">{{ mensaje }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
